name: stepfun-atlas
services:
  seekdb:
    image: oceanbase/seekdb@sha256:4db4961869d554313520d6081fca29265ba6da6db7313311bd8acbed771a956b
    ports:
      - '127.0.0.1:${SEEKDB_PORT:-2881}:2881'
    volumes:
      - seekdb-data:/var/lib/oceanbase
    environment:
      ROOT_PASSWORD: ${SEEKDB_PASSWORD:-}
      MEMORY_LIMIT: 2G
      LOG_DISK_SIZE: 2G
      DATAFILE_SIZE: 2G
      CPU_COUNT: 2
    healthcheck:
      test: ['CMD-SHELL', 'mysql --host=127.0.0.1 --port=2881 --user=root --password="$$ROOT_PASSWORD" -e "SELECT 1"']
      interval: 5s
      timeout: 5s
      retries: 60
    mem_limit: 3g
volumes:
  seekdb-data:
