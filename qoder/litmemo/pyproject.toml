[project]
name = "litmemo"
version = "0.1.0"
description = "Literature and notes retrieval assistant with hybrid search (seekdb) and long-term research memory (PowerContext)."
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pyseekdb==1.4.0.post1",
    "pymysql>=1.1,<2",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "httpx>=0.28,<1",
    "pypdf>=5,<6",
    "fastembed>=0.4,<1",
    "python-multipart>=0.0.9,<1",
    "jieba==0.42.1",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[tool.uv]
package = false
