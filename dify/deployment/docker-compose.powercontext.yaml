# PowerContext Server for the Night Store Dify app.
#
# Put this file next to your Dify docker directory and start it on the same
# Docker network as Dify, then point the app's POWERCONTEXT_BASE_URL at
# http://powercontext:8000.
#
#   docker compose -f docker-compose.powercontext.yaml up -d
#
# Two storage backends are supported:
#   * default (SQLite)  - no extra image build, data in the `powercontext-data` volume
#   * seekdb             - build the image first:
#       docker build --file <powercontext-repo>/dify/deployment/Dockerfile.seekdb \
#         --build-arg POWERCONTEXT_VERSION=1.2.0 --tag powercontext-server:seekdb .
#     then set POWERCONTEXT_SERVER_DATABASE_KIND=seekdb below and uncomment the
#     POWERCONTEXT_SERVER_DATABASE_PATH line.
#
# The seekdb backend embeds seekdb **inside** the PowerContext process (pylibseekdb),
# it does not talk to an external seekdb server. The embedded instance listens on a
# MySQL-protocol Unix socket at <path>/run/sql.sock, which is how the ledger can be
# checked with plain SQL (see dify/scripts/inspect_seekdb.py).

services:
  powercontext:
    image: powercontext-server:local
    # image: powercontext-server:seekdb
    container_name: powercontext
    restart: always
    ports:
      - "127.0.0.1:8100:8000"
    environment:
      POWERCONTEXT_SERVER_MCP_ENABLED: "false"
      POWERCONTEXT_SERVER_DASHBOARD_ENABLED: "false"
      POWERCONTEXT_SERVER_ACCESS_MODE: "disabled"
      # Uncomment when using the seekdb backend:
      #   - "path" is a DIRECTORY: the embedded seekdb instance keeps its data there
      #     (it creates etc/ log/ run/ store/ under it).
      # POWERCONTEXT_SERVER_DATABASE_KIND: "seekdb"
      # POWERCONTEXT_SERVER_DATABASE_PATH: "/data/seekdb"
    volumes:
      - powercontext-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  powercontext-data:
